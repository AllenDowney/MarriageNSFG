[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nsfg"
version = "0.1.0"
description = "Harmonized NSFG data across survey cycles, and analyses of US marriage patterns"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "lifelines",
    "pyreadstat",
    "pyarrow",
    "empiricaldist",
]

[project.optional-dependencies]
dev = [
    "jupytext",
    "nbconvert",
    "jupyterlab",
    "nbclassic",
    "pytest",
    "ruff",
    "black",
    "pylint",
    # building and publishing the posts in jb/
    "jupyter-book>=2",
    "ghp-import",
]

[tool.setuptools]
packages = ["nsfg"]

[tool.ruff]
line-length = 100
exclude = ["archive", "notebooks/archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
# match the interpreter in environment.yml; without this black targets a newer
# Python and emits syntax this one cannot parse
target-version = ["py313"]
line-length = 88

[tool.pylint.main]
# pandas attributes are resolved at runtime, so pylint reports false no-member
# errors on things like pd.DatetimeIndex(...).year
extension-pkg-allow-list = ["pandas", "numpy"]
ignored-modules = ["pandas", "numpy", "scipy", "matplotlib", "seaborn", "lifelines"]

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",   # the readers are self-describing and repetitive
    "import-outside-toplevel",      # deliberate, to keep module import cheap
    "duplicate-code",               # the per-cycle readers are meant to parallel
    "too-many-lines",
    "too-many-locals",
]

[tool.pylint.format]
max-line-length = 100
